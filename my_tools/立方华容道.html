  <!-- 1) System.register 垫片：本产物只注册一个无依赖匿名模块 -->
  <script>
    window.System = {
      register(deps, declare) {
        try {
          const exported = {};
          const exportFn = (name, value) => {
            if (name && typeof name === "object") Object.assign(exported, name);
            else exported[name] = value;
            return value;
          };
          const mod = declare(exportFn, {
            id: "",
            meta: { url: location.href },
            import: () => Promise.resolve({})
          });
          if (mod && typeof mod.execute === "function") mod.execute();
        } catch (err) {
          console.error("[bootstrap] 模块执行失败:", err);
        }
      }
    };
  </script>
