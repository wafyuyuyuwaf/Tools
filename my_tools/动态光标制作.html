<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>图片转 ANI 动态光标（最终修复版）</title>
    <style>
        /* 样式完全沿用最初版本，此处省略以节省篇幅，实际使用时请复制原样式 */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#fff; font-family:'Segoe UI',Roboto,system-ui,sans-serif; padding:30px 20px; display:flex; justify-content:center; color:#1e293b; }
        .container { max-width:820px; width:100%; }
        h1 { font-size:26px; font-weight:600; margin-bottom:4px; letter-spacing:-0.3px; }
        .sub { font-size:14px; color:#64748b; margin-bottom:20px; border-left:3px solid #3b82f6; padding-left:14px; background:#f8fafc; border-radius:0 8px 8px 0; line-height:1.6; }
        .notice { background:#f1f5f9; border-radius:8px; padding:10px 14px; margin-bottom:16px; font-size:14px; color:#1e293b; border-left:4px solid #2563eb; }
        .notice strong { color:#2563eb; }
        .upload-area { border:2px dashed #cbd5e1; border-radius:12px; padding:30px 20px; text-align:center; background:#fafcff; transition:0.2s; cursor:pointer; margin-bottom:16px; }
        .upload-area:hover { border-color:#3b82f6; background:#f0f7ff; }
        .upload-area.dragover { border-color:#3b82f6; background:#e6f0ff; }
        .upload-text { font-size:16px; font-weight:500; }
        .upload-hint { font-size:13px; color:#94a3b8; margin-top:4px; }
        #fileInput { display:none; }
        .frame-list-header { display:flex; justify-content:space-between; align-items:center; margin:12px 0 8px; padding:0 4px; }
        .frame-list-header span { font-size:14px; font-weight:600; color:#475569; }
        .frame-list-header .count { font-weight:400; color:#94a3b8; font-size:13px; }
        .frame-list { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; max-height:480px; overflow-y:auto; padding-right:4px; }
        .frame-item { display:flex; align-items:center; gap:12px; padding:8px 12px; background:#f8fafc; border-radius:10px; border:1px solid #e9edf2; transition:0.15s; flex-wrap:wrap; }
        .frame-item:hover { border-color:#cbd5e1; background:#f1f5f9; }
        .frame-item .thumb { width:44px; height:44px; border-radius:6px; object-fit:cover; background:#e2e8f0; flex-shrink:0; border:1px solid #e2e8f0; }
        .frame-item .idx { font-size:12px; font-weight:600; color:#94a3b8; width:24px; text-align:center; flex-shrink:0; }
        .frame-item .fname { flex:1; font-size:13px; font-weight:500; color:#1e293b; min-width:60px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .frame-item .delay-group { display:flex; align-items:center; gap:4px; flex-shrink:0; }
        .frame-item .delay-group label { font-size:12px; color:#64748b; }
        .frame-item .delay-group input { width:56px; padding:2px 4px; border:1px solid #cbd5e1; border-radius:4px; font-size:13px; text-align:center; background:white; }
        .frame-item .btn-group { display:flex; gap:2px; flex-shrink:0; }
        .frame-item .btn-group button { background:none; border:none; padding:2px 6px; font-size:16px; cursor:pointer; color:#94a3b8; border-radius:4px; transition:0.15s; line-height:1.2; }
        .frame-item .btn-group button:hover { color:#1e293b; background:#e2e8f0; }
        .frame-item .btn-group .del:hover { color:#ef4444; background:#fee2e2; }
        .frame-empty { text-align:center; color:#94a3b8; font-size:14px; padding:20px 0; }
        .hotspot-section { margin:8px 0 12px; border-top:1px solid #e2e8f0; padding-top:14px; }
        .hotspot-title { font-size:14px; font-weight:500; color:#475569; margin-bottom:4px; }
        .hotspot-hint { font-size:13px; color:#64748b; margin-bottom:10px; }
        .preview-container { position:relative; background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; overflow:hidden; touch-action:none; user-select:none; min-height:60px; margin-bottom:8px; max-width:100%; }
        .preview-container img { display:block; width:100%; height:auto; pointer-events:none; }
        .preview-container canvas { position:absolute; top:0; left:0; width:100%; height:100%; display:block; cursor:crosshair; image-rendering:pixelated; image-rendering:crisp-edges; }
        .hotspot-coords { display:flex; align-items:center; gap:18px; flex-wrap:wrap; background:#f8fafc; padding:10px 14px; border-radius:10px; border:1px solid #e2e8f0; }
        .hotspot-coords label { display:flex; align-items:center; gap:6px; font-size:14px; color:#1e293b; }
        .hotspot-coords input[type="number"] { width:70px; padding:4px 8px; border:1px solid #cbd5e1; border-radius:6px; font-size:14px; background:white; }
        .hotspot-coords .hint { color:#64748b; font-size:13px; margin-left:auto; }
        .options-row { display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px; padding:10px 0; border-top:1px solid #e2e8f0; margin:8px 0 12px; }
        .options-row .opt-group { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
        .options-row .opt-group label { display:flex; align-items:center; gap:4px; font-size:14px; cursor:pointer; }
        .options-row .opt-group input[type="checkbox"] { accent-color:#3b82f6; cursor:pointer; width:15px; height:15px; }
        .zip-name-row { display:flex; align-items:center; gap:10px; margin:6px 0 12px; flex-wrap:wrap; }
        .zip-name-row label { font-size:14px; font-weight:500; color:#1e293b; }
        .zip-name-row input { flex:1; min-width:150px; padding:6px 12px; border:1px solid #cbd5e1; border-radius:6px; font-size:14px; background:white; }
        .preview-anim { display:flex; align-items:center; gap:16px; padding:10px 14px; background:#f8fafc; border-radius:10px; border:1px solid #e2e8f0; flex-wrap:wrap; }
        .preview-anim .anim-box { width:64px; height:64px; border-radius:6px; background:#e2e8f0; display:flex; align-items:center; justify-content:center; flex-shrink:0; border:1px solid #cbd5e1; overflow:hidden; }
        .preview-anim .anim-box img { max-width:100%; max-height:100%; object-fit:contain; image-rendering:pixelated; }
        .preview-anim .anim-info { font-size:13px; color:#475569; flex:1; }
        .preview-anim .anim-controls { display:flex; gap:8px; align-items:center; }
        .preview-anim .anim-controls button { border:none; padding:4px 14px; border-radius:20px; font-size:13px; font-weight:500; background:#e2e8f0; color:#475569; cursor:pointer; transition:0.15s; }
        .preview-anim .anim-controls button:hover { background:#cbd5e1; }
        .preview-anim .anim-controls button.active { background:#3b82f6; color:white; }
        .action-bar { display:flex; gap:14px; flex-wrap:wrap; margin:10px 0 8px; }
        .btn { border:none; padding:10px 28px; border-radius:40px; font-size:15px; font-weight:600; background:#e2e8f0; color:#475569; cursor:pointer; transition:0.15s; flex:1 1 auto; text-decoration:none; text-align:center; display:inline-flex; align-items:center; justify-content:center; }
        .btn-primary { background:#1e293b; color:white; }
        .btn-primary:hover:not(:disabled) { background:#0f172a; }
        .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
        .btn-success { background:#3b82f6; color:white; }
        .btn-success:hover { background:#2563eb; }
        .btn-danger { background:#ef4444; color:white; }
        .btn-danger:hover { background:#dc2626; }
        .btn-outline { background:transparent; border:1.5px solid #cbd5e1; }
        .btn-outline:hover { border-color:#94a3b8; background:#f1f5f9; }
        .status { font-size:14px; color:#64748b; min-height:24px; padding:6px 0; }
        .status.error { color:#dc2626; }
        .status.success { color:#16a34a; }
        #downloadLink { display:none; }
        .footer { margin-top:24px; font-size:13px; color:#94a3b8; text-align:center; border-top:1px solid #e2e8f0; padding-top:16px; }
        @media (max-width:600px) { .container { padding:0 4px; } .frame-item { padding:6px 10px; gap:8px; } .frame-item .thumb { width:36px; height:36px; } .frame-item .fname { font-size:12px; min-width:40px; } .frame-item .delay-group input { width:46px; font-size:12px; } .hotspot-coords { flex-direction:column; align-items:stretch; gap:6px; } .hotspot-coords .hint { margin-left:0; } .options-row { flex-direction:column; align-items:stretch; gap:8px; } .preview-anim { flex-direction:column; align-items:stretch; gap:10px; } .preview-anim .anim-controls { justify-content:center; } }
    </style>
</head>
<body>
<div class="container">
    <h1>图片转 ANI 动态光标（最终修复版）</h1>
    <div class="sub">上传多张图片作为动画帧 · 设置热点 · 批量生成多尺寸动态光标并打包下载</div>
    <div class="notice"><strong>热点</strong> 是光标上触发点击的精确像素点（如箭头尖端）。<br>所有帧共享同一热点，点击下方预览图即可设置，也可手动输入坐标。</div>

    <div class="upload-area" id="dropZone">
        <div class="upload-text">点击上传或拖拽图片至此</div>
        <div class="upload-hint">支持 PNG / JPG / WebP 等，按顺序排列帧顺序</div>
        <input type="file" id="fileInput" accept="image/*" multiple>
    </div>

    <div class="frame-list-header">
        <span>帧列表 <span class="count" id="frameCount">(0 帧)</span></span>
        <button class="btn btn-danger btn-outline" id="clearAllBtn" style="padding:4px 14px;font-size:13px;flex:none;">清空全部</button>
    </div>
    <div class="frame-list" id="frameList"><div class="frame-empty">暂无帧，请上传图片</div></div>

    <div class="hotspot-section" id="hotspotSection" style="display:none;">
        <div class="hotspot-title">设置热点</div>
        <div class="hotspot-hint">点击下方预览图确定热点位置，或直接输入 X / Y 坐标</div>
        <div class="preview-container" id="previewContainer">
            <img id="previewImg" src="" alt="预览图" style="visibility:hidden;">
            <canvas id="hotspotCanvas"></canvas>
        </div>
        <div class="hotspot-coords">
            <label>X <input type="number" id="hotX" value="0" min="0" max="255"></label>
            <label>Y <input type="number" id="hotY" value="0" min="0" max="255"></label>
            <span class="hint" id="cursorPos">坐标: (0, 0)</span>
        </div>
    </div>

    <div class="options-row">
        <div class="opt-group">
            <span style="font-size:14px;font-weight:500;color:#475569;">输出尺寸：</span>
            <label><input type="checkbox" value="16"> 16</label>
            <label><input type="checkbox" value="32" checked> 32</label>
            <label><input type="checkbox" value="48" checked> 48</label>
            <label><input type="checkbox" value="64"> 64</label>
            <label><input type="checkbox" value="128"> 128</label>
            <label><input type="checkbox" value="256" checked> 256</label>
        </div>
    </div>
    <div class="zip-name-row">
        <label for="zipNameInput">压缩包名称：</label>
        <input type="text" id="zipNameInput" value="cursors" placeholder="默认 cursors">
    </div>

    <div class="preview-anim" id="animPreview">
        <div class="anim-box" id="animBox"><img id="animImg" src="" alt="预览"></div>
        <div class="anim-info" id="animInfo">未播放</div>
        <div class="anim-controls">
            <button id="playBtn">播放</button>
            <button id="stopBtn">停止</button>
        </div>
    </div>

    <div class="action-bar">
        <button class="btn btn-primary" id="generateBtn" disabled>生成 ANI 文件</button>
        <a id="downloadLink" class="btn btn-success">下载压缩包</a>
    </div>
    <div class="status" id="statusMsg">请上传图片（至少 2 帧）</div>
    <div class="footer">所有帧共享热点 · 导出为 RIFF 格式 ANI 动态光标</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
    (function() {
        // ----- DOM 引用 -----
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const frameListEl = document.getElementById('frameList');
        const frameCount = document.getElementById('frameCount');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const generateBtn = document.getElementById('generateBtn');
        const downloadLink = document.getElementById('downloadLink');
        const statusMsg = document.getElementById('statusMsg');
        const hotspotSection = document.getElementById('hotspotSection');
        const previewImg = document.getElementById('previewImg');
        const canvas = document.getElementById('hotspotCanvas');
        const ctx = canvas.getContext('2d');
        const hotX = document.getElementById('hotX');
        const hotY = document.getElementById('hotY');
        const cursorPos = document.getElementById('cursorPos');
        const animImg = document.getElementById('animImg');
        const animInfo = document.getElementById('animInfo');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        const sizeCheckboxes = document.querySelectorAll('.opt-group input[type="checkbox"]');
        const zipNameInput = document.getElementById('zipNameInput');

        // ----- 数据 -----
        let frames = [];
        let nextId = 0;
        let hotXVal = 0, hotYVal = 0;
        let isImageLoaded = false;
        let imageNaturalWidth = 0, imageNaturalHeight = 0;
        let animTimer = null, animIndex = 0, isPlaying = false;

        // ----- 辅助 -----
        function getSelectedSizes() {
            const sizes = [];
            sizeCheckboxes.forEach(cb => {
                if (cb.checked) {
                    const val = parseInt(cb.value, 10);
                    if (val > 0 && val <= 256) sizes.push(val);
                }
            });
            return sizes.sort((a, b) => a - b);
        }

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error('图片加载失败'));
                img.src = src;
            });
        }

        // 生成 PNG 数据（与静态 CUR 一致）
        function cropAndResizeToPng(img, targetSize) {
            return new Promise((resolve, reject) => {
                try {
                    const srcW = img.naturalWidth || img.width;
                    const srcH = img.naturalHeight || img.height;
                    const cropSize = Math.min(srcW, srcH);
                    const sx = (srcW - cropSize) / 2;
                    const sy = (srcH - cropSize) / 2;
                    const c = document.createElement('canvas');
                    c.width = targetSize;
                    c.height = targetSize;
                    const cx = c.getContext('2d');
                    cx.imageSmoothingEnabled = true;
                    cx.imageSmoothingQuality = 'high';
                    cx.clearRect(0, 0, targetSize, targetSize);
                    cx.drawImage(img, sx, sy, cropSize, cropSize, 0, 0, targetSize, targetSize);
                    c.toBlob((blob) => {
                        if (!blob) reject(new Error('PNG生成失败'));
                        else blob.arrayBuffer().then(buf => resolve(buf)).catch(reject);
                    }, 'image/png');
                } catch (e) { reject(e); }
            });
        }

        // ----- 渲染帧列表 (与原逻辑一致) -----
        function renderFrames() {
            if (frames.length === 0) {
                frameListEl.innerHTML = `<div class="frame-empty">暂无帧，请上传图片</div>`;
                frameCount.textContent = '(0 帧)';
                generateBtn.disabled = true;
                hotspotSection.style.display = 'none';
                statusMsg.textContent = '请上传图片（至少 2 帧）';
                stopAnim();
                return;
            }
            let html = '';
            frames.forEach((f, idx) => {
                html += `
                    <div class="frame-item" data-id="${f.id}">
                        <img class="thumb" src="${f.dataUrl}" alt="${f.name}">
                        <span class="idx">#${idx + 1}</span>
                        <span class="fname" title="${f.name}">${f.name}</span>
                        <div class="delay-group">
                            <label>延迟</label>
                            <input type="number" class="delay-input" value="${f.delay}" min="10" max="10000" data-id="${f.id}">
                            <label>ms</label>
                        </div>
                        <div class="btn-group">
                            <button class="move-up" data-id="${f.id}" title="上移">↑</button>
                            <button class="move-down" data-id="${f.id}" title="下移">↓</button>
                            <button class="del" data-id="${f.id}" title="删除">✕</button>
                        </div>
                    </div>
                `;
            });
            frameListEl.innerHTML = html;
            frameCount.textContent = `(${frames.length} 帧)`;

            // 事件绑定
            document.querySelectorAll('.delay-input').forEach(inp => {
                inp.addEventListener('change', function() {
                    const id = parseInt(this.dataset.id, 10);
                    const f = frames.find(x => x.id === id);
                    if (f) {
                        let v = parseInt(this.value, 10);
                        if (isNaN(v) || v < 10) v = 10;
                        if (v > 10000) v = 10000;
                        f.delay = v;
                        this.value = v;
                        if (isPlaying) restartAnim();
                    }
                });
            });
            document.querySelectorAll('.move-up').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id, 10);
                    const idx = frames.findIndex(x => x.id === id);
                    if (idx > 0) {
                        [frames[idx], frames[idx - 1]] = [frames[idx - 1], frames[idx]];
                        renderFrames();
                        if (isPlaying) restartAnim();
                    }
                });
            });
            document.querySelectorAll('.move-down').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id, 10);
                    const idx = frames.findIndex(x => x.id === id);
                    if (idx >= 0 && idx < frames.length - 1) {
                        [frames[idx], frames[idx + 1]] = [frames[idx + 1], frames[idx]];
                        renderFrames();
                        if (isPlaying) restartAnim();
                    }
                });
            });
            document.querySelectorAll('.frame-item .del').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id, 10);
                    frames = frames.filter(x => x.id !== id);
                    renderFrames();
                    if (frames.length > 0 && isPlaying) restartAnim();
                    else if (frames.length === 0) stopAnim();
                    if (frames.length > 0) loadHotspotPreview(frames[0]);
                    downloadLink.style.display = 'none';
                    downloadLink.href = '#';
                });
            });

            generateBtn.disabled = false;
            if (frames.length > 0) {
                hotspotSection.style.display = 'block';
                loadHotspotPreview(frames[0]);
                statusMsg.textContent = `已加载 ${frames.length} 帧，可设置热点后生成 ANI。`;
                if (!isPlaying) startAnim();
            }
        }

        // ----- 热点预览 (不变) -----
        function loadHotspotPreview(item) {
            const img = new Image();
            img.onload = function() {
                imageNaturalWidth = img.naturalWidth;
                imageNaturalHeight = img.naturalHeight;
                isImageLoaded = true;
                previewImg.src = img.src;
                previewImg.style.visibility = 'visible';
                canvas.width = imageNaturalWidth;
                canvas.height = imageNaturalHeight;
                hotXVal = Math.min(hotXVal, imageNaturalWidth - 1);
                hotYVal = Math.min(hotYVal, imageNaturalHeight - 1);
                hotXVal = Math.max(0, hotXVal);
                hotYVal = Math.max(0, hotYVal);
                hotX.value = hotXVal;
                hotY.value = hotYVal;
                updateHotspotMarker(hotXVal, hotYVal);
                cursorPos.textContent = `坐标: (${hotXVal}, ${hotYVal})`;
            };
            img.onerror = function() {
                previewImg.style.visibility = 'hidden';
                canvas.width = 64;
                canvas.height = 64;
                isImageLoaded = false;
                statusMsg.textContent = '无法预览该图片，请手动输入热点';
            };
            img.src = item.dataUrl;
        }

        function updateHotspotMarker(x, y) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!isImageLoaded) return;
            const w = imageNaturalWidth, h = imageNaturalHeight;
            const maxDim = Math.max(w, h);
            if (maxDim < 64) { ctx.fillStyle='red'; ctx.fillRect(x,y,1,1); return; }
            const halfLen = Math.max(8, Math.min(40, Math.round(maxDim/12)));
            const lineWidth = Math.max(1, Math.round(halfLen/5));
            const dotRadius = Math.max(1, Math.round(halfLen/3));
            ctx.save();
            ctx.strokeStyle='red'; ctx.lineWidth=lineWidth;
            ctx.beginPath();
            ctx.moveTo(x-halfLen,y); ctx.lineTo(x-3,y);
            ctx.moveTo(x+3,y); ctx.lineTo(x+halfLen,y);
            ctx.moveTo(x,y-halfLen); ctx.lineTo(x,y-3);
            ctx.moveTo(x,y+3); ctx.lineTo(x,y+halfLen);
            ctx.stroke();
            ctx.fillStyle='red';
            ctx.beginPath(); ctx.arc(x,y,dotRadius,0,2*Math.PI); ctx.fill();
            ctx.restore();
        }

        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = e.clientX ?? e.touches?.[0]?.clientX ?? 0;
            const clientY = e.clientY ?? e.touches?.[0]?.clientY ?? 0;
            let x = (clientX - rect.left) * scaleX;
            let y = (clientY - rect.top) * scaleY;
            x = Math.min(Math.max(0, x), canvas.width);
            y = Math.min(Math.max(0, y), canvas.height);
            return { x: Math.round(x), y: Math.round(y) };
        }

        // ----- 动画预览 (不变) -----
        function startAnim() {
            if (frames.length < 2) { animInfo.textContent='至少需要 2 帧'; return; }
            stopAnim();
            isPlaying = true;
            animIndex = 0;
            playBtn.textContent='暂停'; playBtn.classList.add('active');
            showFrame(0);
            playNext();
        }
        function stopAnim() {
            isPlaying = false;
            if (animTimer) { clearTimeout(animTimer); animTimer = null; }
            playBtn.textContent='播放'; playBtn.classList.remove('active');
            if (frames.length > 0) { showFrame(0); animInfo.textContent=`已停止 (共 ${frames.length} 帧)`; }
            else { animImg.src=''; animInfo.textContent='无帧'; }
        }
        function restartAnim() { if (isPlaying) { stopAnim(); startAnim(); } }
        function playNext() {
            if (!isPlaying || frames.length === 0) return;
            const f = frames[animIndex];
            if (!f) { stopAnim(); return; }
            showFrame(animIndex);
            const delay = f.delay || 100;
            animTimer = setTimeout(() => { animIndex = (animIndex+1) % frames.length; playNext(); }, delay);
        }
        function showFrame(idx) {
            if (idx >= 0 && idx < frames.length) {
                const f = frames[idx];
                animImg.src = f.dataUrl;
                animInfo.textContent = `帧 ${idx+1}/${frames.length} 延迟 ${f.delay}ms`;
            }
        }

        // ----- 生成 ANI (最终修复版) -----
        async function generateAni() {
            if (frames.length < 2) {
                statusMsg.textContent = '至少需要 2 帧才能生成动态光标';
                statusMsg.className = 'status error';
                return;
            }

            let sizes = getSelectedSizes();
            let forced = false;
            if (!sizes.includes(32) && !sizes.includes(48)) {
                sizes.push(32); sizes.sort((a,b)=>a-b); forced = true;
                statusMsg.textContent = '已自动添加 32×32 尺寸（Win11 兼容性要求）';
                statusMsg.className = 'status';
            } else if (!sizes.includes(32)) {
                sizes.push(32); sizes.sort((a,b)=>a-b); forced = true;
                statusMsg.textContent = '已自动添加 32×32 尺寸（Win11 兼容性要求）';
                statusMsg.className = 'status';
            }
            if (sizes.length === 0) {
                statusMsg.textContent = '请至少选择一个输出尺寸';
                statusMsg.className = 'status error';
                return;
            }

            hotXVal = parseInt(hotX.value) || 0;
            hotYVal = parseInt(hotY.value) || 0;
            if (isImageLoaded) {
                hotXVal = Math.min(hotXVal, imageNaturalWidth-1);
                hotYVal = Math.min(hotYVal, imageNaturalHeight-1);
                hotXVal = Math.max(0, hotXVal);
                hotYVal = Math.max(0, hotYVal);
                hotX.value = hotXVal; hotY.value = hotYVal;
            }

            generateBtn.disabled = true;
            if (!forced) { statusMsg.textContent = '正在生成 ANI 文件...'; statusMsg.className = 'status'; }
            downloadLink.style.display = 'none';

            try {
                const loadedImages = [];
                for (const f of frames) {
                    const img = await loadImage(f.dataUrl);
                    loadedImages.push(img);
                }

                const zip = new JSZip();
                const baseName = zipNameInput.value.trim() || 'cursors';
                const safeBase = baseName.replace(/[^a-zA-Z0-9\u4e00-\u9fa5_\- ]/g, '');

                for (const size of sizes) {
                    const frameData = [];
                    for (let i = 0; i < frames.length; i++) {
                        const f = frames[i];
                        const img = loadedImages[i];
                        // 生成 PNG 数据
                        const buffer = await cropAndResizeToPng(img, size);

                        const srcW = img.naturalWidth || img.width;
                        const srcH = img.naturalHeight || img.height;
                        const cropSize = Math.min(srcW, srcH);
                        const sx = (srcW - cropSize) / 2;
                        const sy = (srcH - cropSize) / 2;
                        let adjX = hotXVal - sx;
                        let adjY = hotYVal - sy;
                        adjX = Math.max(0, Math.min(cropSize, adjX));
                        adjY = Math.max(0, Math.min(cropSize, adjY));
                        let targetHotX = Math.round(adjX * (size / cropSize));
                        let targetHotY = Math.round(adjY * (size / cropSize));
                        targetHotX = Math.min(size-1, Math.max(0, targetHotX));
                        targetHotY = Math.min(size-1, Math.max(0, targetHotY));

                        frameData.push({
                            pngBuffer: buffer,
                            hotX: targetHotX,
                            hotY: targetHotY,
                            delay: f.delay || 100,
                        });
                    }
                    const aniBuffer = buildAniFile(frameData, size);
                    zip.file(`${safeBase}_${size}.ani`, aniBuffer);
                }

                const zipBlob = await zip.generateAsync({ type: 'blob' });
                const url = URL.createObjectURL(zipBlob);
                downloadLink.href = url;
                downloadLink.download = `${safeBase}.zip`;
                downloadLink.style.display = 'inline-flex';
                let msg = `生成完成！共 ${sizes.length} 个尺寸，已打包为 ${safeBase}.zip。`;
                if (forced) msg += ' (自动包含 32×32 兼容尺寸)';
                statusMsg.textContent = msg;
                statusMsg.className = 'status success';

                // 安装引导
                setTimeout(() => {
                    alert(
                        '✅ ANI 文件已生成！\n\n' +
                        '请按以下步骤安装（必须通过控制面板）：\n' +
                        '1. 打开「控制面板」→「鼠标」→「指针」选项卡\n' +
                        '2. 在“自定义”列表中选择一个项目（如“正常选择”）\n' +
                        '3. 点击「浏览」，找到并选中任意一个 .ani 文件（推荐 32 或 48 尺寸）\n' +
                        '4. 点击「打开」后，务必点击「另存为」保存为新主题\n' +
                        '5. 点击「应用」\n\n' +
                        '如果光标仍未变化，请重启资源管理器（任务管理器重启 explorer.exe）或注销重登。'
                    );
                }, 300);
            } catch (err) {
                console.error(err);
                statusMsg.textContent = '生成失败: ' + err.message;
                statusMsg.className = 'status error';
            } finally {
                generateBtn.disabled = false;
            }
        }

        // ----- 构建 ANI 文件 (最终修复版：PNG + dwFlags=1) -----
        function buildAniFile(frameData, size) {
            const numFrames = frameData.length;

            const frameIconData = [];
            let framListSize = 0;
            for (const fd of frameData) {
                const entry = new ArrayBuffer(16);
                const dv = new DataView(entry);
                const w = (size === 256) ? 0 : size;
                const h = (size === 256) ? 0 : size;
                dv.setUint8(0, w);
                dv.setUint8(1, h);
                dv.setUint8(2, 0);
                dv.setUint8(3, 0);
                // 热点写入 wPlanes 和 wBitCount
                dv.setUint16(4, fd.hotX, true);
                dv.setUint16(6, fd.hotY, true);
                const dataLen = fd.pngBuffer.byteLength;
                dv.setUint32(8, dataLen, true);
                dv.setUint32(12, 16, true); // dwImageOffset
                const combined = new Uint8Array(16 + dataLen);
                combined.set(new Uint8Array(entry), 0);
                combined.set(new Uint8Array(fd.pngBuffer), 16);
                frameIconData.push(combined);
                framListSize += combined.byteLength;
            }

            const anihSize = 8 + 4 + 36;
            const framListTotal = 8 + 4 + framListSize;
            const rateListTotal = 8 + 4 + 4 * numFrames;
            const riffTotal = 4 + 4 + 4 + anihSize + framListTotal + rateListTotal;
            const riffDataSize = riffTotal - 8;

            const buffer = new ArrayBuffer(riffTotal);
            const view = new DataView(buffer);
            let pos = 0;

            view.setUint32(pos, 0x46464952, true); pos += 4; // 'RIFF'
            view.setUint32(pos, riffDataSize, true); pos += 4;
            view.setUint32(pos, 0x4E4F4341, true); pos += 4; // 'ACON'

            // LIST 'anih'
            view.setUint32(pos, 0x5453494C, true); pos += 4;
            view.setUint32(pos, anihSize - 8, true); pos += 4;
            view.setUint32(pos, 0x68696E61, true); pos += 4; // 'anih'
            view.setUint32(pos, 36, true); pos += 4; // cbSize
            view.setUint32(pos, numFrames, true); pos += 4; // cFrames
            view.setUint32(pos, numFrames, true); pos += 4; // cSteps
            const anihWH = (size === 256) ? 0 : size;
            view.setUint32(pos, anihWH, true); pos += 4; // cx
            view.setUint32(pos, anihWH, true); pos += 4; // cy
            view.setUint32(pos, 0, true); pos += 4; // cBitCount
            view.setUint32(pos, 0, true); pos += 4; // cPlanes
            const defaultJif = Math.max(1, Math.round((frameData[0].delay || 100) / 1000 * 60));
            view.setUint32(pos, defaultJif, true); pos += 4; // jifRate
            // ★★★ 关键修复：dwFlags = 0x00000001 ★★★
            view.setUint32(pos, 0x00000001, true); pos += 4; // dwFlags

            // LIST 'fram'
            view.setUint32(pos, 0x5453494C, true); pos += 4;
            view.setUint32(pos, framListTotal - 8, true); pos += 4;
            view.setUint32(pos, 0x6D617266, true); pos += 4; // 'fram'
            for (const data of frameIconData) {
                new Uint8Array(buffer).set(data, pos);
                pos += data.byteLength;
            }

            // LIST 'rate'
            view.setUint32(pos, 0x5453494C, true); pos += 4;
            view.setUint32(pos, rateListTotal - 8, true); pos += 4;
            view.setUint32(pos, 0x65746172, true); pos += 4; // 'rate'
            for (const fd of frameData) {
                const jif = Math.max(1, Math.round((fd.delay || 100) / 1000 * 60));
                view.setUint32(pos, jif, true);
                pos += 4;
            }

            return buffer;
        }

        // ----- 添加文件 (不变) -----
        function addFiles(fileList) {
            const validFiles = Array.from(fileList).filter(f => f.type.startsWith('image/'));
            if (validFiles.length === 0) { statusMsg.textContent='没有有效的图片文件'; return; }
            let loaded = 0;
            for (const file of validFiles) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    const img = new Image();
                    img.onload = function() {
                        frames.push({ id: nextId++, file, dataUrl, name: file.name, delay: 100, width: img.naturalWidth, height: img.naturalHeight });
                        loaded++;
                        if (loaded === validFiles.length) {
                            renderFrames();
                            if (frames.length >= 2 && !isPlaying) startAnim();
                            downloadLink.style.display = 'none'; downloadLink.href = '#';
                            statusMsg.textContent = `已添加 ${validFiles.length} 张图片`;
                            statusMsg.className = 'status success';
                        }
                    };
                    img.onerror = function() { statusMsg.textContent = `图片 "${file.name}" 无法加载，已跳过`; loaded++; if (loaded === validFiles.length) renderFrames(); };
                    img.src = dataUrl;
                };
                reader.onerror = function() { statusMsg.textContent = '读取文件失败: ' + file.name; };
                reader.readAsDataURL(file);
            }
        }

        // ----- 事件绑定 -----
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); if (e.dataTransfer.files.length > 0) addFiles(e.dataTransfer.files); });
        fileInput.addEventListener('change', (e) => { if (e.target.files.length > 0) addFiles(e.target.files); fileInput.value = ''; });

        clearAllBtn.addEventListener('click', () => {
            if (frames.length === 0) return;
            if (confirm('确定要清空所有帧吗？')) {
                frames = []; renderFrames(); stopAnim(); downloadLink.style.display = 'none'; downloadLink.href = '#';
                statusMsg.textContent = '已清空所有帧'; statusMsg.className = 'status';
            }
        });

        generateBtn.addEventListener('click', generateAni);

        // 热点交互
        canvas.addEventListener('click', function(e) {
            if (!isImageLoaded) return;
            const pos = getCanvasCoords(e);
            hotXVal = pos.x; hotYVal = pos.y;
            hotX.value = hotXVal; hotY.value = hotYVal;
            updateHotspotMarker(hotXVal, hotYVal);
            cursorPos.textContent = `坐标: (${hotXVal}, ${hotYVal})`;
        });
        canvas.addEventListener('touchmove', function(e) {
            e.preventDefault();
            if (!isImageLoaded) return;
            const pos = getCanvasCoords(e);
            hotXVal = pos.x; hotYVal = pos.y;
            hotX.value = hotXVal; hotY.value = hotYVal;
            updateHotspotMarker(hotXVal, hotYVal);
            cursorPos.textContent = `坐标: (${hotXVal}, ${hotYVal})`;
        }, { passive: false });
        canvas.addEventListener('touchend', function(e) {
            if (!isImageLoaded) return;
            const touch = e.changedTouches[0];
            if (!touch) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
            let x = (touch.clientX - rect.left) * scaleX, y = (touch.clientY - rect.top) * scaleY;
            x = Math.min(Math.max(0, x), canvas.width); y = Math.min(Math.max(0, y), canvas.height);
            hotXVal = Math.round(x); hotYVal = Math.round(y);
            hotX.value = hotXVal; hotY.value = hotYVal;
            updateHotspotMarker(hotXVal, hotYVal);
            cursorPos.textContent = `坐标: (${hotXVal}, ${hotYVal})`;
        });

        hotX.addEventListener('input', function() {
            if (!isImageLoaded) return;
            const x = parseInt(this.value) || 0, y = parseInt(hotY.value) || 0;
            hotXVal = x; hotYVal = y;
            updateHotspotMarker(x, y);
            cursorPos.textContent = `坐标: (${x}, ${y})`;
        });
        hotY.addEventListener('input', function() {
            if (!isImageLoaded) return;
            const y = parseInt(this.value) || 0, x = parseInt(hotX.value) || 0;
            hotXVal = x; hotYVal = y;
            updateHotspotMarker(x, y);
            cursorPos.textContent = `坐标: (${x}, ${y})`;
        });

        playBtn.addEventListener('click', function() {
            if (frames.length < 2) { statusMsg.textContent='至少需要 2 帧才能播放'; return; }
            if (isPlaying) stopAnim(); else startAnim();
        });
        stopBtn.addEventListener('click', stopAnim);

        renderFrames();
    })();
</script>
